name: Generate and Obfuscate Worker Script

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - '明文源吗'

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save terser @babel/parser @babel/traverse @babel/types @babel/generator

      - name: Create AST Obfuscator
        run: |
          cat > obfuscate.js << 'EOF'
          const fs = require('fs');
          const parser = require('@babel/parser');
          const traverse = require('@babel/traverse').default;
          const t = require('@babel/types');
          const generate = require('@babel/generator').default;
          const terser = require('terser');

          const SOURCE = '明文源吗';
          const OUTPUT = '少年你相信光吗';

          const CHUNK_SIZE = 3;

          // 需要拆分的敏感字符串类型
          const SENSITIVE_PATTERN =
            /https?:\/\/|(?:\b(?:[a-z0-9-]+\.)+(?:com|net|org|io|dev|app|co|cn|me|info|biz|xyz|top|cloud)\b)|\bProxyIP\b|\b(?:\d{1,3}\.){3}\d{1,3}\b/i;

          function readSource() {
            if (!fs.existsSync(SOURCE)) {
              throw new Error('Source file not found: ' + SOURCE);
            }

            const code = fs.readFileSync(SOURCE, 'utf8');

            if (!code.trim()) {
              throw new Error('Source file is empty');
            }

            return code;
          }

          // 每一个 UTF-16 代码单元转换成 \uXXXX
          function toUnicode(value) {
            let result = '"';

            for (let i = 0; i < value.length; i++) {
              const hex = value.charCodeAt(i)
                .toString(16)
                .padStart(4, '0');

              result += '\\u' + hex;
            }

            return result + '"';
          }

          // 将 AST 字符串节点设置为 Unicode 原始表示
          function encodeLiteral(node, value) {
            node.extra = {
              rawValue: value,
              raw: toUnicode(value)
            };

            return node;
          }

          // 将敏感字符串转换为多个字符串相加
          function splitSensitive(value) {
            const chunks = [];

            for (let i = 0; i < value.length; i += CHUNK_SIZE) {
              chunks.push(
                encodeLiteral(
                  t.stringLiteral(value.slice(i, i + CHUNK_SIZE)),
                  value.slice(i, i + CHUNK_SIZE)
                )
              );
            }

            if (chunks.length === 1) {
              return chunks[0];
            }

            return chunks.reduce((left, right) =>
              t.binaryExpression('+', left, right)
            );
          }

          // 处理单个字符串 AST 节点
          function transformString(path, value) {
            if (
              SENSITIVE_PATTERN.test(value) &&
              path.isReferenced()
            ) {
              path.replaceWith(splitSensitive(value));
              return;
            }

            encodeLiteral(path.node, value);
          }

          async function main() {
            const originalCode = readSource();

            // 第一阶段：Terser 压缩及局部变量混淆
            const minified = await terser.minify(originalCode, {
              compress: {
                passes: 2,
                dead_code: true,
                drop_debugger: true,
                evaluate: true,
                booleans: true,
                conditionals: true,
                sequences: true,
                unused: true
              },

              mangle: {
                toplevel: false,
                properties: false
              },

              format: {
                comments: false,
                ascii_only: true,
                semicolons: true
              }
            });

            if (!minified.code) {
              throw new Error('Terser produced empty output');
            }

            // 第二阶段：解析 JavaScript AST
            const ast = parser.parse(minified.code, {
              sourceType: 'unambiguous',
              allowAwaitOutsideFunction: true
            });

            // 第三阶段：字符串 Unicode 化和敏感字符串拆分
            traverse(ast, {
              StringLiteral(path) {
                transformString(path, path.node.value);
              },

              DirectiveLiteral(path) {
                encodeLiteral(path.node, path.node.value);
              },

              // 处理没有插值表达式的普通模板字符串
              TemplateLiteral(path) {
                if (
                  path.node.expressions.length !== 0 ||
                  path.parentPath.isTaggedTemplateExpression()
                ) {
                  return;
                }

                const value = path.node.quasis[0].value.cooked;

                if (value === null) {
                  return;
                }

                transformString(path, value);
              }
            });

            // 第四阶段：重新生成紧凑代码
            const output = generate(ast, {
              compact: true,
              minified: true,
              comments: false,
              jsescOption: {
                minimal: false,
                quotes: 'double'
              }
            }).code;

            if (!output || !output.trim()) {
              throw new Error('Generated output is empty');
            }

            // 第五阶段：再次解析生成结果，验证语法
            parser.parse(output, {
              sourceType: 'unambiguous',
              allowAwaitOutsideFunction: true
            });

            fs.writeFileSync(OUTPUT, output, 'utf8');

            console.log('================================');
            console.log('Obfuscation completed');
            console.log('Source:', SOURCE);
            console.log('Output:', OUTPUT);
            console.log('Original size:', originalCode.length);
            console.log('Output size:', output.length);
            console.log('================================');
          }

          main().catch(error => {
            console.error('Obfuscation failed:', error);
            process.exit(1);
          });
          EOF

      - name: Run AST Obfuscator
        run: node obfuscate.js

      - name: Commit and push obfuscated file
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add '少年你相信光吗'

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "部署用这个"
            git push
          fi
